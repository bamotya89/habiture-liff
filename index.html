<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>自分トリセツ診断 | Habiture</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #3d7a5a;
            --primary-light: #e8f5ee;
            --accent: #e8a87c;
            --accent-light: #fdf3ea;
            --bg: #faf9f7;
            --text: #2c2c2c;
            --muted: #7a7069;
            --border: #e0d8d0;
            --white: #ffffff;
            --danger-light: #fdf0f0;
            --danger: #c0392b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            padding-bottom: 56px;
        }

        /* ── Header ── */
        .header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 18px 24px 22px;
        }
        .header-logo { font-size: 10px; letter-spacing: 4px; opacity: 0.6; margin-bottom: 5px; }
        .header-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }

        /* ── Progress ── */
        .progress-wrap { padding: 16px 24px 0; }
        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .progress-label { font-size: 12px; color: var(--muted); }
        .progress-dots {
            display: flex;
            gap: 4px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: background 0.3s;
        }
        .dot.done { background: var(--primary); }
        .dot.active { background: var(--accent); }
        .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.4s ease; }

        /* ── Question ── */
        .question-wrap { padding: 28px 24px 0; }
        .question-num {
            font-size: 10px; color: var(--primary);
            letter-spacing: 3px; font-weight: 600;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 17px; font-weight: 700;
            line-height: 1.65; margin-bottom: 24px;
        }
        .choices { display: flex; flex-direction: column; gap: 11px; }
        .choice-btn {
            width: 100%;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 15px 18px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s, border-color 0.12s, transform 0.1s;
        }
        .choice-btn:active {
            background: var(--primary-light);
            border-color: var(--primary);
            transform: scale(0.98);
        }
        .choice-label {
            font-weight: 700;
            color: var(--primary);
            min-width: 16px;
            font-size: 13px;
            padding-top: 1px;
            flex-shrink: 0;
        }

        /* ── Loading ── */
        .loading { text-align: center; padding: 80px 24px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Intro ── */
        .intro-wrap { padding: 32px 24px; }
        .intro-body {
            font-size: 15px; line-height: 2.0;
            color: var(--text); margin-bottom: 24px;
        }
        .intro-body strong { color: var(--primary); }
        .intro-time {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 28px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }
        .intro-time-icon { font-size: 18px; flex-shrink: 0; }
        .start-btn {
            display: block; width: 100%;
            background: var(--primary); color: white;
            border: none; border-radius: 12px;
            padding: 18px;
            font-size: 17px; font-weight: 700;
            cursor: pointer; letter-spacing: 1px;
        }

        /* ── Result ── */
        .result-wrap { padding: 24px 24px 0; }
        .result-hero {
            background: var(--primary); color: white;
            border-radius: 16px;
            padding: 28px 24px 30px;
            text-align: center;
            margin-bottom: 18px;
        }
        .result-icon { font-size: 52px; margin-bottom: 10px; line-height: 1; }
        .result-tag {
            display: inline-block;
            font-size: 10px; letter-spacing: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 3px 12px;
            margin-bottom: 10px;
        }
        .result-type-name { font-size: 22px; font-weight: 800; margin-bottom: 3px; }
        .result-sub { font-size: 12px; opacity: 0.7; letter-spacing: 1.5px; }

        .result-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 10px;
            color: var(--primary);
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .card-body { font-size: 14px; line-height: 1.9; }

        .anaru-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .anaru-item {
            display: flex;
            gap: 10px;
            font-size: 14px;
            line-height: 1.6;
        }
        .anaru-check {
            color: var(--primary);
            font-weight: 700;
            flex-shrink: 0;
            padding-top: 1px;
        }

        .weapon-box {
            background: var(--primary-light);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.75;
            font-weight: 500;
        }

        .pitfall-box {
            background: var(--accent-light);
            border-left: 3px solid var(--accent);
            border-radius: 0 8px 8px 0;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.75;
        }
        .pitfall-label {
            font-size: 11px;
            font-weight: 700;
            color: #b5651d;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .ineffective-list { display: flex; flex-direction: column; gap: 14px; }
        .ineffective-advice {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            background: var(--bg);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .ineffective-reason {
            font-size: 13px;
            line-height: 1.75;
            color: var(--text);
            padding: 0 4px;
        }

        .strategy-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .strategy-item { display: flex; gap: 12px; align-items: flex-start; }
        .strategy-num {
            width: 24px; height: 24px;
            background: var(--primary); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
            flex-shrink: 0; margin-top: 1px;
        }
        .strategy-text { font-size: 14px; line-height: 1.65; }
        .strategy-name { font-weight: 700; color: var(--primary); }
        .strategy-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

        /* ── CTA ── */
        .cta-wrap { padding: 4px 24px 0; }
        .cta-note {
            font-size: 13px; color: var(--muted);
            text-align: center; line-height: 1.85;
            margin-bottom: 16px;
        }
        .cta-btn {
            display: block; width: 100%;
            background: var(--primary); color: white;
            border: none; border-radius: 12px;
            padding: 18px;
            font-size: 16px; font-weight: 700;
            cursor: pointer; letter-spacing: 0.5px;
        }
        .cta-btn:disabled { opacity: 0.6; }
        .sent-msg {
            text-align: center; font-size: 14px;
            color: var(--primary);
            padding: 12px;
            background: var(--primary-light);
            border-radius: 8px; margin-top: 12px;
        }
    </style>
</head>

// ============================================================
// State
// ============================================================
let currentQ = 0;
let answers = { A: 0, B: 0, C: 0, D: 0 };
let userId = null;

// ============================================================
// LIFF 初期化
// ============================================================
async function initLiff() {
    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }
        const profile = await liff.getProfile();
        userId = profile.userId;
    } catch (e) {
        userId = null; // テスト時はnullのまま続行
    }
    showIntro();
}

// ============================================================
// 画面描画
// ============================================================
function render(html) {
    document.getElementById('app').innerHTML = html;
}

function showIntro() {
    render(`
        <div class="intro-wrap">
            <p class="intro-body">
                こんにちは、ひかりです。<br><br>
                「続けようと思ったのに、また続かなかった」<br><br>
                それ、<strong>意志の問題じゃない</strong>んです。<br>
                自分に合った<strong>続け方のタイプ</strong>を知らなかっただけかもしれない。<br><br>
                10問で、あなたの「得意な続け方」がわかります。
            </p>
            <div class="intro-time">
                <span class="intro-time-icon">⏱</span>
                <span>所要時間：約2〜3分<br>直感で選んでください。正解も不正解もありません。</span>
            </div>
            <button class="start-btn" onclick="startQuiz()">診断スタート →</button>
        </div>
    `);
}

function startQuiz() {
    currentQ = 0;
    answers = { A: 0, B: 0, C: 0, D: 0 };
    showQuestion();
}

function buildDots() {
    return questions.map((_, i) => {
        let cls = 'dot';
        if (i < currentQ) cls += ' done';
        else if (i === currentQ) cls += ' active';
        return `<div class="${cls}"></div>`;
    }).join('');
}

function showQuestion() {
    const q = questions[currentQ];
    const progress = (currentQ / questions.length) * 100;

    render(`
        <div class="progress-wrap">
            <div class="progress-row">
                <span class="progress-label">Q${currentQ + 1} / ${questions.length}</span>
                <div class="progress-dots">${buildDots()}</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width:${progress}%"></div>
            </div>
        </div>
        <div class="question-wrap">
            <div class="question-num">Q U E S T I O N &nbsp; ${currentQ + 1}</div>
            <div class="question-text">${q.text}</div>
            <div class="choices">
                ${q.choices.map(c => `
                    <button class="choice-btn" onclick="answer('${c.label}')">
                        <span class="choice-label">${c.label}</span>
                        <span>${c.text}</span>
                    </button>
                `).join('')}
            </div>
        </div>
    `);
}

function answer(label) {
    answers[label]++;
    currentQ++;
    if (currentQ < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function getResultType() {
    // 同点の場合は最初に多く選んだものを優先
    const sorted = Object.entries(answers).sort((a, b) => b[1] - a[1]);
    return sorted[0][0];
}

function showResult() {
    const type = getResultType();
    const r = results[type];

    render(`
        <div class="result-wrap">
            <div class="result-hero">
                <div class="result-icon">${r.icon}</div>
                <div class="result-tag">あなたのタイプ</div>
                <div class="result-type-name">${r.typeName}</div>
                <div class="result-sub">${r.subName}</div>
            </div>

            <div class="result-card">
                <div class="card-title">T Y P E</div>
                <p class="card-body">${r.desc}</p>
            </div>

            <div class="result-card">
                <div class="card-title">あるある</div>
                <ul class="anaru-list">
                    ${r.anaru.map(a => `
                        <li class="anaru-item">
                            <span class="anaru-check">✔</span>
                            <span>${a}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>

            <div class="result-card">
                <div class="card-title">あなたの武器</div>
                <div class="weapon-box">🔑 ${r.weapon}</div>
            </div>

            <div class="result-card">
                <div class="card-title">注意したい落とし穴</div>
                <div class="pitfall-box">
                    <div class="pitfall-label">⚠ PITFALL</div>
                    ${r.pitfall}
                </div>
            </div>

            <div class="result-card">
                <div class="card-title">なぜあのアドバイスが効かなかったか</div>
                <div class="ineffective-list">
                    ${r.ineffective.map(item => `
                        <div>
                            <div class="ineffective-advice">${item.advice}</div>
                            <div class="ineffective-reason">${item.reason}</div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="result-card">
                <div class="card-title">おすすめの習慣化戦略</div>
                <ul class="strategy-list">
                    ${r.strategies.map((s, i) => `
                        <li class="strategy-item">
                            <div class="strategy-num">${i + 1}</div>
                            <div class="strategy-text">
                                <div><span class="strategy-name">${s.name}：</span>${s.text}</div>
                                <div class="strategy-sub">${s.sub}</div>
                            </div>
                        </li>
                    `).join('')}
                </ul>
            </div>
        </div>

        <div class="cta-wrap">
            <p class="cta-note">
                これは、あなたのトリセツの最初の1ページ。<br>
                続きを一緒に作りたい方へ。
            </p>
            <button id="cta-btn" class="cta-btn" onclick="sendAndClose('${type}')">
                結果をLINEに保存して続きへ →
            </button>
            <div id="sent-status"></div>
        </div>
    `);
}

async function sendAndClose(typeCode) {
    const btn = document.getElementById('cta-btn');
    const status = document.getElementById('sent-status');

    btn.disabled = true;
    btn.textContent = '送信中...';

    const sent = await sendResult(typeCode);

    if (sent) {
        status.innerHTML = '<div class="sent-msg">✅ LINEに結果を送りました！</div>';
        setTimeout(() => {
            try { liff.closeWindow(); } catch(e) {}
        }, 1800);
    } else {
        status.innerHTML = '<div class="sent-msg" style="background:#fdf0f0;color:#c0392b">⚠ 送信できませんでした。LINEに戻って「講座」と送ってください。</div>';
        btn.disabled = false;
        btn.textContent = '結果をLINEに保存して続きへ →';
    }
}

async function sendResult(typeCode) {
    if (!userId || !GAS_URL || GAS_URL === 'YOUR_GAS_URL') return false;
    try {
        const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, typeCode })
        });
        return res.ok;
    } catch (e) {
        return false;
    }
}

// 起動
initLiff();
